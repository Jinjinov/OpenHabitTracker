name: openhabittracker
title: OpenHabitTracker
icon: net.openhabittracker.OpenHabitTracker.svg
website: https://openhabittracker.net
source-code: https://github.com/Jinjinov/OpenHabitTracker
issues: https://github.com/Jinjinov/OpenHabitTracker/issues
license: GPL-3.0
version: '1.2.4'
grade: stable #devel
summary: Take notes, plan tasks, track habits
description: |
  Take notes, plan tasks, and track habits - native apps on all your devices, plus a web app. Free, ad-free, and open source. No account needed: all your data stays on your device.

  Habits without streak guilt:

  Instead of a streak counter, every habit has a desired repeat interval. The app shows how overdue each habit is as a percentage of that interval, so you always see what needs attention first. Missing a day never resets anything. Classic streaks are available too - off by default.

  Notes, tasks and habits in one place:

  - Notes with full Markdown support
  - Tasks with planned dates, duration and time tracking
  - Habits with flexible repeat intervals - track repetitions, time or quantity
  - Checklist sub-items on both tasks and habits
  - Categories, colors, priorities, search, filters and sorting - for notes, tasks and habits

  Your data stays yours:

  - All data is stored locally on your device
  - Export and import: Markdown, JSON, YAML, TSV
  - Import your notes from Google Keep
  - Optional sync: host the Docker image on your own server and every app, desktop or mobile, can log in and sync

  Made to fit you:

  - 26 themes with dark and light mode
  - Customizable UI - show or hide almost every element
  - Available in 20 languages
  - Keyboard navigation and screen reader support

base: core24

confinement: strict #devmode

parts:
  openhabittracker:
    source: .
    plugin: dotnet
    # dotnet-build-configuration: Release
    # dotnet-self-contained-runtime-identifier: linux-x64
    dotnet-version: "10.0"
    dotnet-configuration: "Release"
    dotnet-build-framework: "net10.0"
    dotnet-verbosity: "normal"
    dotnet-project: OpenHabitTracker.Blazor.Photino/OpenHabitTracker.Blazor.Photino.csproj
    dotnet-properties:
      PublishSingleFile: "true"
      # the plugin's "dotnet publish --self-contained False" is dropped when PublishSingleFile
      # is a property on the same command line, so it has to be repeated here
      SelfContained: "false"
    # build-packages:
    #   - dotnet-sdk-10.0
    override-build: |
      craftctl default
      # Replace content of .desktop file
      cp net.openhabittracker.OpenHabitTracker.desktop $CRAFT_PART_INSTALL
      sed -i "s|Exec=OpenHT|Exec=openhabittracker|g" $CRAFT_PART_INSTALL/net.openhabittracker.OpenHabitTracker.desktop
      sed -i "s|Icon=net.openhabittracker.OpenHabitTracker|Icon=$SNAP/meta/gui/icon.svg|g" \
        $CRAFT_PART_INSTALL/net.openhabittracker.OpenHabitTracker.desktop

apps:
  openhabittracker:
    extensions: [ gnome, dotnet10 ]
    command: OpenHT
    desktop: net.openhabittracker.OpenHabitTracker.desktop
    plugs:
      - hardware-observe
      - home
      - removable-media
      - network
